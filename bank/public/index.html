<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Bank – Staff Sign in</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bank">
  <header class="top"><span class="brand">Partner Bank · Staff Portal</span><span class="who small">MOCK BANK</span></header>
  <main>
    <section class="card" id="login-card">
      <span class="role-tag">Bank admin</span>
      <h1>Staff sign in</h1>
      <form id="login">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p class="demo muted">Demo: bankadmin / Bank@123</p>
    </section>
  </main>
  <script type="module" src="/index.js"></script>
</body>
</html>
